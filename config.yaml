# ai-radar 统一配置
#
# 所有 Skill 启动时读取本文件。修改后无需改代码。
# LiteLLM 路由约定:
#   - 本地 ollama:    model: "ollama/<name>"  + api_base: "http://localhost:11434"
#   - SiliconFlow:    model: "openai/<repo-id>" + api_base: "https://api.siliconflow.cn/v1"
#                     + SILICONFLOW_API_KEY  (OpenAI 兼容协议)
#   - Kimi/Moonshot:  model: "openai/<model>" + api_base: "https://api.moonshot.cn/v1"
#                     + MOONSHOT_API_KEY     (OpenAI 兼容协议)
#   - OpenAI:         model: "gpt-4o-mini"    + 环境变量 OPENAI_API_KEY
#   - Anthropic:      model: "claude-sonnet-4-6"  + ANTHROPIC_API_KEY
#   - DeepSeek:       model: "deepseek/deepseek-chat"  + DEEPSEEK_API_KEY
#   - LiteLLM Proxy:  model: 任意 + api_base: "http://your-proxy:4000"
#
# 切模型 = 改这里的 active 与 profiles，不动 Python 代码。

version: 1

# ============== Triage 阶段 ==============
# 用途: 对 scan 出的 candidate 做 reject/maybe/deepdive 三档决策。
# 原则: 量大、便宜、人工兜底。默认走 SiliconFlow (硅基流动)。
triage:
  active: siliconflow-qwen3-omni-30b-thinking   # 指向下方 profiles 里的某个 key
  temperature: 0.2
  timeout_seconds: 120          # thinking 模型推理稍慢，放宽
  fallback: null                # 失败即停 (Phase 1 不静默降级)

  profiles:
    # SiliconFlow（硅基流动）— OpenAI 兼容协议，通过 litellm "openai/" 前缀路由
    siliconflow-qwen3-omni-30b-thinking:
      provider: siliconflow
      model: openai/Qwen/Qwen3-Omni-30B-A3B-Thinking
      api_base: https://api.siliconflow.cn/v1
      api_key_env: SILICONFLOW_API_KEY

    siliconflow-qwen3-14b:
      provider: siliconflow
      model: openai/Qwen/Qwen3-14B
      api_base: https://api.siliconflow.cn/v1
      api_key_env: SILICONFLOW_API_KEY

    siliconflow-deepseek-v32:
      provider: siliconflow
      model: openai/deepseek-ai/DeepSeek-V3.2
      api_base: https://api.siliconflow.cn/v1
      api_key_env: SILICONFLOW_API_KEY

    # 本地 ollama（备用，需 ollama pull）
    local-qwen3-14b:
      provider: ollama
      model: ollama/qwen3:14b
      api_base: http://localhost:11434
      api_key_env: null

    local-qwen3-4b:
      provider: ollama
      model: ollama/qwen3:4b
      api_base: http://localhost:11434
      api_key_env: null

    # 其他云端
    cloud-deepseek-chat:
      provider: deepseek
      model: deepseek/deepseek-chat
      api_base: null            # 用 SDK 默认 endpoint
      api_key_env: DEEPSEEK_API_KEY

    cloud-gpt-4o-mini:
      provider: openai
      model: gpt-4o-mini
      api_base: null
      api_key_env: OPENAI_API_KEY

# ============== Deepdive 阶段 ==============
# 用途: 对 triage=deepdive 的 repo 生成结构化 entry。
# 原则: 结构化输出质量更重要，默认走 SiliconFlow DeepSeek V3.2（非 thinking、长输出友好）。
#
# 模型选择记录:
# - 曾默认 kimi-k2.6 (thinking)，实测 reasoning_content 吃 max_tokens，单条 deepdive
#   8-9 分钟、16k token 起步，与本阶段"中等输入 + 结构化长输出"不匹配，
#   2026-05-22 改为 DeepSeek V3.2，Kimi 保留为 fallback / 特殊场景。
deepdive:
  active: siliconflow-deepseek-v32
  temperature: 0.3                                # 非 thinking，温度可控
  timeout_seconds: 180
  max_runs_per_week: 5                            # 成本控制，由调用方维护配额计数
  fallback: kimi-k2-6                             # DeepSeek 不可用时降级 Kimi

  profiles:
    # Kimi / Moonshot — OpenAI 兼容协议
    kimi-k2-6:
      provider: moonshot
      model: openai/kimi-k2.6
      api_base: https://api.moonshot.cn/v1
      api_key_env: MOONSHOT_API_KEY

    # 其他云端
    cloud-claude-sonnet-46:
      provider: anthropic
      model: claude-sonnet-4-6
      api_base: null
      api_key_env: ANTHROPIC_API_KEY

    cloud-claude-opus-47:
      provider: anthropic
      model: claude-opus-4-7
      api_base: null
      api_key_env: ANTHROPIC_API_KEY

    cloud-deepseek-v3:
      provider: deepseek
      model: deepseek/deepseek-chat
      api_base: null
      api_key_env: DEEPSEEK_API_KEY

    siliconflow-qwen3-omni-30b-thinking:
      provider: siliconflow
      model: openai/Qwen/Qwen3-Omni-30B-A3B-Thinking
      api_base: https://api.siliconflow.cn/v1
      api_key_env: SILICONFLOW_API_KEY

    siliconflow-deepseek-v32:
      provider: siliconflow
      model: openai/deepseek-ai/DeepSeek-V3.2
      api_base: https://api.siliconflow.cn/v1
      api_key_env: SILICONFLOW_API_KEY

    local-qwen3-14b:
      provider: ollama
      model: ollama/qwen3:14b
      api_base: http://localhost:11434
      api_key_env: null

# ============== LiteLLM Proxy (可选) ==============
# 若你有自建 LiteLLM Proxy（统一 router + 成本统计），把上面任意 profile 的
# api_base 改为 proxy 地址，并把 model 改成 proxy 里注册的别名即可。
# 例:
#   profiles:
#     via-proxy:
#       provider: openai          # 任意，proxy 兼容 openai 协议
#       model: my-router-alias
#       api_base: http://localhost:4000
#       api_key_env: LITELLM_MASTER_KEY

# ============== 全局观测 (可选) ==============
observability:
  # 若启用，会把 trace 同时写一份去 langfuse（Phase 1 默认关闭）
  langfuse:
    enabled: false
    host: https://cloud.langfuse.com
    public_key_env: LANGFUSE_PUBLIC_KEY
    secret_key_env: LANGFUSE_SECRET_KEY
